[project]
name = "zkt_k50_biomatrics"
description = "Device management and reliable HRMS checkin ingestion for ZKTeco K50"
authors = [{name = "ZKT K50 Biomatrics contributors"}]
requires-python = ">=3.11"
dynamic = ["version"]
readme = "README.md"
dependencies = ["pyzk>=0.9,<0.10", "requests>=2.31,<3"]
[project.scripts]
zkt-k50-agent = "zkt_k50_biomatrics.edge_agent.cli:main"
[build-system]
requires = ["flit_core>=3.4,<4"]
build-backend = "flit_core.buildapi"
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
